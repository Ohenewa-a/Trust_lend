<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustLend - Sign Up</title>

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            brandDark: '#0B1E3F',
            brandOrange: '#F59E0B',
            bgLight: '#F8FAFC',
          },
        },
      },
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- Card Container -->
  <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row min-h-[700px]">
    
    <!-- Left Banner / Image Section -->
    <div class="w-full md:w-5/12 relative bg-gray-900 text-white flex flex-col justify-between p-6">
      <!-- Background image with overlay -->
      <img 
        src="images/sign-up(background).png" 
        alt="Canon DSLR camera on dark background" 
        class="absolute inset-0 w-full h-full object-cover"
      />
      <div class="absolute inset-0 bg-black/50" aria-hidden="true"></div>

      <!-- Brand Logo -->
      <div class="relative z-10 flex items-center space-x-2">
        <div class="w-9 h-9 rounded-full border-2 border-brandOrange flex items-center justify-center bg-brandDark">
          <i class="fa-solid fa-key text-brandOrange text-xs"></i>
        </div>
        <span class="text-xl font-bold tracking-tight">
          Trust<span class="text-brandOrange">Lend</span>
        </span>
      </div>

      <!-- Spacer so logo stays top, nothing at bottom -->
      <div class="relative z-10"></div>
    </div>

    <!-- Right Form Section -->
    <div class="w-full md:w-7/12 bg-white p-8 sm:p-12 flex flex-col justify-center">
      
      <!-- Heading -->
      <div class="text-center mb-6">
        <h2 class="text-2xl sm:text-3xl font-bold text-gray-900">
          Sign up as a <span id="role-title-text" class="text-brandOrange">Renter</span>
        </h2>
        
        <!-- Role Toggle -->
        <div class="inline-flex bg-gray-200 p-1 rounded-full mt-4 w-full max-w-xs">
          <button 
            id="btn-renter" 
            onclick="setRole('renter')" 
            class="w-1/2 py-2 px-4 rounded-full text-sm font-semibold transition-all duration-300 bg-brandDark text-white shadow-md"
          >
            I'm a Renter
          </button>
          <button 
            id="btn-owner" 
            onclick="setRole('owner')" 
            class="w-1/2 py-2 px-4 rounded-full text-sm font-semibold transition-all duration-300 text-gray-600 hover:text-brandDark"
          >
            I'm an Owner
          </button>
        </div>

        <!-- Subtitle -->
        <p id="role-description" class="text-sm text-gray-500 mt-3">
          Find trusted equipment nearby and book with confidence.
        </p>
      </div>

      <!-- Sign Up Form -->
      <form onsubmit="handleSignup(event)" class="space-y-4 max-w-sm mx-auto w-full">
        
        <!-- Full Name -->
        <div>
          <input 
            type="text" 
            id="fullname" 
            required 
            placeholder="Full Name" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition"
          />
        </div>

        <!-- Email -->
        <div>
          <input 
            type="email" 
            id="email" 
            required 
            placeholder="Email address" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition"
          />
        </div>

        <!-- Phone Number -->
        <div>
          <input 
            type="tel" 
            id="phone" 
            required 
            placeholder="Phone number" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition"
          />
        </div>

        <!-- Password -->
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="Password" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition pr-10"
          />
          <button 
            type="button" 
            onclick="togglePassword('password', 'password-icon')" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
          >
            <i id="password-icon" class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>

        <!-- Confirm Password -->
        <div class="relative">
          <input 
            type="password" 
            id="confirm-password" 
            required 
            placeholder="Confirm password" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition pr-10"
          />
          <button 
            type="button" 
            onclick="togglePassword('confirm-password', 'confirm-icon')" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
          >
            <i id="confirm-icon" class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>

        <!-- Terms & Conditions Checkbox -->
        <div class="flex items-start gap-2">
          <input 
            type="checkbox" 
            id="terms" 
            required 
            class="mt-1 w-4 h-4 rounded border-gray-300 text-brandDark focus:ring-brandDark cursor-pointer"
          />
          <label for="terms" class="text-xs text-gray-500 cursor-pointer">
            I <span class="text-brandOrange font-semibold">agree</span> to the 
            <a href="#" class="text-brandDark font-semibold hover:underline">Terms &amp; Conditions</a> and 
            <a href="#" class="text-brandDark font-semibold hover:underline">Privacy Policy</a>
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full bg-brandDark hover:bg-slate-800 text-white font-semibold py-3 rounded-lg text-sm shadow-md transition duration-200"
        >
          Create Account
        </button>
      </form>

      <!-- Login Link -->
      <div class="text-center text-xs text-gray-500 mt-4">
        Already have an account? 
        <a href="login.html" class="text-brandOrange font-semibold hover:underline">Log in</a>
      </div>

    </div>
  </div>

  <!-- JavaScript -->
  <script>
    let currentRole = 'renter';

    function setRole(role) {
      currentRole = role;

      const btnRenter = document.getElementById('btn-renter');
      const btnOwner = document.getElementById('btn-owner');
      const roleTitle = document.getElementById('role-title-text');
      const roleDesc = document.getElementById('role-description');

      const activeClasses = 'w-1/2 py-2 px-4 rounded-full text-sm font-semibold transition-all duration-300 bg-brandDark text-white shadow-md';
      const inactiveClasses = 'w-1/2 py-2 px-4 rounded-full text-sm font-semibold transition-all duration-300 text-gray-600 hover:text-brandDark';

      if (role === 'renter') {
        btnRenter.className = activeClasses;
        btnOwner.className = inactiveClasses;
        roleTitle.textContent = 'Renter';
        roleDesc.textContent = 'Find trusted equipment nearby and book with confidence.';
      } else {
        btnOwner.className = activeClasses;
        btnRenter.className = inactiveClasses;
        roleTitle.textContent = 'Owner';
        roleDesc.textContent = 'List your equipment and start earning from your gear.';
      }
    }

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);

      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function handleSignup(e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (password !== confirm) {
        alert('Passwords do not match.');
        return;
      }

      alert(`Account created as ${currentRole.toUpperCase()}!`);
    }
  </script>
</body>
</html>
