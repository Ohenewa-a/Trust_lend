<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustLend Authentication</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: '#132F6B',
            brandHover: '#0D234F',
            accent: '#F59E0B',
            surface: '#F6F8FD',
          },
        },
      },
    }
  </script>
</head>

<body class="bg-[#f4f6fb] min-h-screen flex items-center justify-center p-4">

  <!-- Card Container — reduced max-width so it doesn't stretch too wide -->
  <div class="w-full max-w-5xl bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col md:flex-row">

    <!-- ============ LEFT: Image ============ -->
    <div class="w-full md:w-5/12 relative min-h-[250px] md:min-h-[700px]">
      <img
        id="sideImage"
        src="images/signup(renter & owner).png"
        alt="Canon DSLR camera on dark background"
        class="absolute inset-0 w-full h-full object-cover"
      />
      <!-- Dark overlay -->
      <div class="absolute inset-0 bg-black/40"></div>

      <!-- Logo -->
      <div class="absolute top-8 left-8 flex items-center gap-2 z-10">
        <img src="images/logo.png" class="w-10" alt="TrustLend logo" />
        <h1 class="text-white font-bold text-2xl">
          Trust<span class="text-accent">Lend</span>
        </h1>
      </div>
    </div>

    <!-- ============ RIGHT: Form ============ -->
    <div class="w-full md:w-7/12 bg-surface p-8 sm:p-10 flex items-center">
      <div class="w-full max-w-md mx-auto">

        <!-- Title -->
        <h2 id="pageTitle" class="text-3xl font-bold text-center text-brand">
          Sign up as a
        </h2>
        <h3 id="roleTitle" class="text-3xl font-bold text-center text-accent mt-1">
          Renter
        </h3>

        <!-- Role Toggle -->
        <div class="flex justify-center mt-6">
          <div class="bg-white rounded-full p-1 flex shadow">
            <button
              id="renterBtn"
              type="button"
              onclick="switchRole('renter')"
              class="px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 bg-brand text-white"
            >
              I'm a Renter
            </button>
            <button
              id="ownerBtn"
              type="button"
              onclick="switchRole('owner')"
              class="px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 text-brand"
            >
              I'm an Owner
            </button>
          </div>
        </div>

        <!-- Description -->
        <p id="description" class="text-center text-gray-500 text-sm mt-4">
          Find trusted equipment nearby and book with confidence.
        </p>

        <!-- Form -->
        <form id="authForm" onsubmit="handleSubmit(event)" class="mt-6 space-y-4">

          <!-- Signup-only fields -->
          <div id="signupFields">
            <div class="space-y-4">
              <input
                type="text"
                placeholder="Full Name"
                required
                class="w-full border border-gray-300 rounded-lg px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand transition"
              />
              <!-- (Email is shared, sits outside this wrapper) -->
            </div>
          </div>

          <!-- Email — always visible -->
          <input
            id="emailInput"
            type="email"
            placeholder="Email Address"
            required
            class="w-full border border-gray-300 rounded-lg px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand transition"
          />

          <!-- Phone — signup only -->
          <div id="phoneField">
            <input
              type="tel"
              placeholder="Phone Number"
              required
              class="w-full border border-gray-300 rounded-lg px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand transition"
            />
          </div>

          <!-- Password -->
          <div class="relative">
            <input
              id="password"
              type="password"
              placeholder="Password"
              required
              class="w-full border border-gray-300 rounded-lg px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand transition pr-12"
            />
            <button
              type="button"
              onclick="togglePassword('password', 'pwIcon')"
              class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600"
            >
              <i id="pwIcon" class="fa-regular fa-eye-slash text-sm"></i>
            </button>
          </div>

          <!-- Confirm Password — signup only -->
          <div id="confirmField" class="relative">
            <input
              id="confirmPassword"
              type="password"
              placeholder="Confirm Password"
              required
              class="w-full border border-gray-300 rounded-lg px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand transition pr-12"
            />
            <button
              type="button"
              onclick="togglePassword('confirmPassword', 'cpIcon')"
              class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600"
            >
              <i id="cpIcon" class="fa-regular fa-eye-slash text-sm"></i>
            </button>
          </div>

          <!-- Terms checkbox — signup only -->
          <div id="termsField" class="flex items-start gap-2">
            <input
              type="checkbox"
              id="terms"
              required
              class="mt-1 w-4 h-4 rounded border-gray-300 cursor-pointer"
            />
            <label for="terms" class="text-sm text-gray-600 cursor-pointer">
              I <span class="text-accent font-semibold">agree</span> to the
              <a href="#" class="text-brand font-semibold hover:underline">Terms &amp; Conditions</a>
              and
              <a href="#" class="text-brand font-semibold hover:underline">Privacy Policy</a>
            </label>
          </div>

          <!-- Login-only: Forgot password -->
          <div id="forgotField" class="hidden text-left">
            <a href="#" class="text-sm font-semibold text-accent hover:underline">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button
            id="submitBtn"
            type="submit"
            class="w-full bg-brand hover:bg-brandHover text-white py-3 rounded-lg font-semibold text-sm shadow-md transition duration-200"
          >
            Create Account
          </button>
        </form>

        <!-- Login-only: Social login -->
        <div id="socialLogin" class="hidden">
          <div class="relative flex py-4 items-center">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="flex-shrink mx-3 text-xs text-gray-400">Or</span>
            <div class="flex-grow border-t border-gray-300"></div>
          </div>
          <div class="flex justify-center gap-4">
            <button type="button" class="w-10 h-10 rounded-full border border-gray-300 flex items-center justify-center bg-white shadow-sm hover:bg-gray-50 transition">
              <i class="fa-brands fa-google text-red-500"></i>
            </button>
            <button type="button" class="w-10 h-10 rounded-full border border-gray-300 flex items-center justify-center bg-white shadow-sm hover:bg-gray-50 transition">
              <i class="fa-brands fa-apple text-black"></i>
            </button>
            <button type="button" class="w-10 h-10 rounded-full border border-gray-300 flex items-center justify-center bg-white shadow-sm hover:bg-gray-50 transition">
              <i class="fa-brands fa-facebook-f text-blue-600"></i>
            </button>
          </div>
        </div>

        <!-- Bottom link -->
        <p id="bottomLink" class="text-center text-sm text-gray-500 mt-6">
          Already have an account?
          <a href="#" onclick="switchMode(event)" class="text-accent font-semibold hover:underline">Log in</a>
        </p>

      </div>
    </div>
    <!-- end right side -->

  </div>
  <!-- end card -->

  <script>
    let currentRole = 'renter';
    let currentMode = 'signup';

    // ── Side Image Paths ─────────────────────
    const sideImages = {
      signup: 'images/signup(renter & owner).png',
      login:  'images/login(renter & owner).png',
    };

    function updateSideImage() {
      document.getElementById('sideImage').src = sideImages[currentMode];
    }

    // ── Role Toggle ──────────────────────────
    function switchRole(role) {
      currentRole = role;

      const renterBtn  = document.getElementById('renterBtn');
      const ownerBtn   = document.getElementById('ownerBtn');
      const roleTitle  = document.getElementById('roleTitle');
      const pageTitle  = document.getElementById('pageTitle');
      const description = document.getElementById('description');

      const activeClasses   = 'px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 bg-brand text-white';
      const inactiveClasses = 'px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 text-brand';

      if (role === 'renter') {
        renterBtn.className = activeClasses;
        ownerBtn.className  = inactiveClasses;
        roleTitle.textContent = 'Renter';
        pageTitle.textContent = currentMode === 'signup' ? 'Sign up as a' : 'Login as a';
        description.textContent = 'Find trusted equipment nearby and book with confidence.';
      } else {
        ownerBtn.className  = activeClasses;
        renterBtn.className = inactiveClasses;
        roleTitle.textContent = 'Owner';
        pageTitle.textContent = currentMode === 'signup' ? 'Sign up as an' : 'Login as an';
        description.textContent = 'List your equipment and start earning from your gear.';
      }

      updateSideImage();
    }

    // ── Signup / Login Toggle ────────────────
    function switchMode(e) {
      if (e) e.preventDefault();

      const signupFields = document.getElementById('signupFields');
      const phoneField   = document.getElementById('phoneField');
      const confirmField = document.getElementById('confirmField');
      const termsField   = document.getElementById('termsField');
      const forgotField  = document.getElementById('forgotField');
      const socialLogin  = document.getElementById('socialLogin');
      const submitBtn    = document.getElementById('submitBtn');
      const pageTitle    = document.getElementById('pageTitle');
      const bottomLink   = document.getElementById('bottomLink');

      const signupInputs = [
        ...signupFields.querySelectorAll('input'),
        ...phoneField.querySelectorAll('input'),
        ...confirmField.querySelectorAll('input'),
        ...termsField.querySelectorAll('input'),
      ];

      if (currentMode === 'signup') {
        currentMode = '#';

        signupFields.classList.add('hidden');
        phoneField.classList.add('hidden');
        confirmField.classList.add('hidden');
        termsField.classList.add('hidden');

        forgotField.classList.remove('hidden');
        socialLogin.classList.remove('hidden');

        signupInputs.forEach(input => input.removeAttribute('required'));

        submitBtn.textContent = 'Login';
        pageTitle.textContent = currentRole === 'renter' ? 'Login as a' : 'Login as an';

        bottomLink.innerHTML =
          'Don\'t have an account? <a href="#" onclick="switchMode(event)" class="text-accent font-semibold hover:underline">Sign up</a>';

      } else {
        currentMode = 'signup';

        signupFields.classList.remove('hidden');
        phoneField.classList.remove('hidden');
        confirmField.classList.remove('hidden');
        termsField.classList.remove('hidden');

        forgotField.classList.add('hidden');
        socialLogin.classList.add('hidden');

        signupInputs.forEach(input => input.setAttribute('required', ''));

        submitBtn.textContent = 'Create Account';
        pageTitle.textContent = currentRole === 'renter' ? 'Sign up as a' : 'Sign up as an';

        bottomLink.innerHTML =
          'Already have an account? <a href="#" onclick="switchMode(event)" class="text-accent font-semibold hover:underline">Log in</a>';
      }

      updateSideImage();
    }

    // ── Password Visibility ─────────────────
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);

      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      }
    }

    // ── Form Submit ─────────────────────────
    function handleSubmit(e) {
      e.preventDefault();

      // Password matching check for signup mode
      if (currentMode === 'signup') {
        const pw = document.getElementById('password').value;
        const cp = document.getElementById('confirmPassword').value;

        if (pw !== cp) {
          alert('Passwords do not match.');
          return;
        }
      }

      // Redirect based on the active role (Renter vs Owner)
      if (currentRole === 'renter') {
        window.location.href = 'r-dashboard.html';
      } else {
        window.location.href = 'o-dashboard.html';
      }
    }
  </script>

</body>
</html>
