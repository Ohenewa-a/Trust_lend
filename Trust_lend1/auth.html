<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating | TrustLend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center space-y-4">
        <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-xl">
            <i class="fa-solid fa-spinner fa-spin"></i>
        </div>
        <h2 class="text-xl font-bold text-[#0E2B63]">Setting up your session...</h2>
        <p class="text-xs text-gray-500">Please wait while we route you to your secure dashboard environment.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let role = urlParams.get('role') || localStorage.getItem('userRole') || 'renter';
        localStorage.setItem('userRole', role);

        setTimeout(() => {
            if (role === 'owner') {
                window.location.href = '/Trust_lend1/owner pages/o-dashboard.html';
            } else {
                window.location.href = '/Trust_lend1/renter pages/dashboard.html';
            }
        }, 800);
    </script>
</body>
</html>
