<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustLend - Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { brandDark: '#0B1E3F', brandOrange: '#F59E0B', bgLight: '#F8FAFC' },
        },
      },
    }
  </script>
  <style>
    .shake{animation:shake .4s ease-in-out}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .fade-in{animation:fadeIn .3s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row min-h-[700px]">

    <div class="w-full md:w-5/12 relative bg-gray-900 text-white flex flex-col justify-between p-6">
      <img src="/Trust_lend1/images/login(renter & owner).png" alt="Camera equipment" class="absolute inset-0 w-full h-full object-cover" />
      <div class="absolute inset-0 bg-black/50"></div>
      <div class="relative z-10 flex items-center space-x-2">
        <div class="w-9 h-9 rounded-full border-2 border-brandOrange flex items-center justify-center bg-brandDark">
          <i class="fa-solid fa-key text-brandOrange text-xs"></i>
        </div>
        <span class="text-xl font-bold tracking-tight">Trust<span class="text-brandOrange">Lend</span></span>
      </div>
      <div class="relative z-10"></div>
    </div>

    <div class="w-full md:w-7/12 bg-white p-8 sm:p-12 flex flex-col justify-center">

      <div class="text-center mb-6">
        <h2 class="text-2xl sm:text-3xl font-bold text-gray-900">
          Sign up as a <span id="role-title-text" class="text-brandOrange">Renter</span>
        </h2>
        <div class="inline-flex bg-gray-200 p-1 rounded-full mt-4 w-full max-w-xs">
          <button id="btn-renter" onclick="setRole('renter')" type="button"
            class="w-1/2 py-2 px-4 rounded-full text-sm font-semibold transition-all duration-300 bg-brandDark text-white shadow-md">I'm a Renter</button>
          <button id="btn-owner" onclick="setRole('owner')" type="button"
            class="w-1/2 py-2 px-4 rounded-full text-sm font-semibold transition-all duration-300 text-gray-600 hover:text-brandDark">I'm an Owner</button>
        </div>
        <p id="role-description" class="text-sm text-gray-500 mt-3">Find trusted equipment nearby and book with confidence.</p>
      </div>

      <form id="signupForm" onsubmit="handleSignup(event)" novalidate class="space-y-4 max-w-sm mx-auto w-full">

        <div>
          <input type="text" id="fullname" required placeholder="Full Name" oninput="vName()" onblur="vName()"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition" />
          <p id="nameErr" class="text-[11px] text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <input type="email" id="email" required placeholder="Email address" oninput="vEmail()" onblur="vEmail()"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition" />
          <p id="emailErr" class="text-[11px] text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <input type="tel" id="phone" required placeholder="Phone number (e.g. 08012345678)" oninput="fmtPhone()" onblur="vPhone()" maxlength="11"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition" />
          <p id="phoneErr" class="text-[11px] text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <div class="relative">
            <input type="password" id="password" required placeholder="Password" oninput="vPw();vMatch()" onblur="vPw()"
              class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition pr-10" />
            <button type="button" onclick="togPw('password','pwI')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
              <i id="pwI" class="fa-regular fa-eye-slash text-sm"></i>
            </button>
          </div>
          <div class="mt-2">
            <div class="flex gap-1"><div id="s1" class="h-1 flex-1 rounded-full bg-gray-200 transition-all"></div><div id="s2" class="h-1 flex-1 rounded-full bg-gray-200 transition-all"></div><div id="s3" class="h-1 flex-1 rounded-full bg-gray-200 transition-all"></div><div id="s4" class="h-1 flex-1 rounded-full bg-gray-200 transition-all"></div></div>
            <p id="strLbl" class="text-[10px] text-gray-400 mt-1"></p>
          </div>
          <p id="pwErr" class="text-[11px] text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <div class="relative">
            <input type="password" id="confirm-password" required placeholder="Confirm password" oninput="vMatch()" onblur="vMatch()"
              class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brandDark transition pr-10" />
            <button type="button" onclick="togPw('confirm-password','cpI')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
              <i id="cpI" class="fa-regular fa-eye-slash text-sm"></i>
            </button>
          </div>
          <p id="matchErr" class="text-[11px] text-red-500 mt-1 hidden"></p>
          <p id="matchOk" class="text-[11px] text-green-600 mt-1 hidden"><i class="fa-solid fa-check text-[9px] mr-1"></i>Passwords match</p>
        </div>

        <div>
          <div class="flex items-start gap-2">
            <input type="checkbox" id="terms" required onchange="vTerms()" class="mt-1 w-4 h-4 rounded border-gray-300 text-brandDark focus:ring-brandDark cursor-pointer" />
            <label for="terms" class="text-xs text-gray-500 cursor-pointer">
              I <span class="text-brandOrange font-semibold">agree</span> to the
              <a href="#" class="text-brandDark font-semibold hover:underline">Terms &amp; Conditions</a> and
              <a href="#" class="text-brandDark font-semibold hover:underline">Privacy Policy</a>
            </label>
          </div>
          <p id="termsErr" class="text-[11px] text-red-500 mt-1 hidden"></p>
        </div>

        <button id="submitBtn" type="submit"
          class="w-full bg-brandDark hover:bg-slate-800 text-white font-semibold py-3 rounded-lg text-sm shadow-md transition duration-200 flex items-center justify-center gap-2">
          <span id="btnText">Create Account</span><i id="btnSpin" class="fa-solid fa-spinner fa-spin hidden"></i>
        </button>
      </form>

      <div class="text-center text-xs text-gray-500 mt-4">
        Already have an account? <a href="login.html" class="text-brandOrange font-semibold hover:underline">Log in</a>
      </div>
    </div>
  </div>

  <div id="modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center fade-in shadow-xl">
      <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-check text-green-600 text-2xl"></i></div>
      <h3 class="text-lg font-bold text-gray-900 mb-2">Account Created!</h3>
      <p id="modalMsg" class="text-sm text-gray-500 mb-6">Redirecting to your dashboard...</p>
      <button onclick="goToDashboard()" class="w-full bg-brandDark hover:bg-slate-800 text-white font-semibold py-3 rounded-lg text-sm transition">Continue to Dashboard</button>
    </div>
  </div>

  <script>
    const $=id=>document.getElementById(id);
    let currentRole='renter';

    function setRole(r){
      currentRole=r;
      localStorage.setItem("userRole", r);
      const on='w-1/2 py-2 px-4 rounded-full text-sm font-semibold transition-all duration-300 bg-brandDark text-white shadow-md';
      const off='w-1/2 py-2 px-4 rounded-full text-sm font-semibold transition-all duration-300 text-gray-600 hover:text-brandDark';
      $('btn-renter').className=r==='renter'?on:off;
      $('btn-owner').className=r==='owner'?on:off;
      $('role-title-text').textContent=r==='renter'?'Renter':'Owner';
      $('role-description').textContent=r==='renter'?'Find trusted equipment nearby and book with confidence.':'List your equipment and start earning from your gear.';
    }

    const urlRole=new URLSearchParams(window.location.search).get('role');
    if(urlRole==='owner')setRole('owner');

    function togPw(iid,icid){const i=$(iid),c=$(icid);if(i.type==='password'){i.type='text';c.classList.remove('fa-eye-slash');c.classList.add('fa-eye');}else{i.type='password';c.classList.remove('fa-eye');c.classList.add('fa-eye-slash');}}

    function showE(id,m){const e=$(id);e.textContent=m;e.classList.remove('hidden');}
    function hideE(id){$(id).classList.add('hidden');}
    function setV(el){el.classList.remove('border-red-400','border-gray-300');el.classList.add('border-green-400');}
    function setI(el){el.classList.remove('border-green-400','border-gray-300');el.classList.add('border-red-400');}

    function vName(){const e=$('fullname'),v=e.value.trim();if(!v){showE('nameErr','Full name is required.');setI(e);return false;}if(v.length<3){showE('nameErr','At least 3 characters.');setI(e);return false;}if(!v.includes(' ')){showE('nameErr','Enter first and last name.');setI(e);return false;}hideE('nameErr');setV(e);return true;}
    function vEmail(){const e=$('email'),v=e.value.trim();if(!v){showE('emailErr','Email is required.');setI(e);return false;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){showE('emailErr','Enter a valid email.');setI(e);return false;}hideE('emailErr');setV(e);return true;}
    function fmtPhone(){const e=$('phone');e.value=e.value.replace(/[^\d]/g,'').slice(0,11);if(e.value.length>=11)vPhone();}
    function vPhone(){const e=$('phone'),v=e.value.replace(/[^\d]/g,'');if(!v){showE('phoneErr','Phone is required.');setI(e);return false;}if(v.length<10||v.length>11){showE('phoneErr','Enter 10-11 digits.');setI(e);return false;}hideE('phoneErr');setV(e);return true;}

    function getStr(p){let s=0;if(p.length>=6)s++;if(p.length>=8)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return Math.min(s,4);}
    function vPw(){const e=$('password'),v=e.value;const st=getStr(v);const c=['bg-gray-200','bg-red-400','bg-orange-400','bg-yellow-400','bg-green-500'];const l=['','Weak','Fair','Good','Strong'];const lc=['text-gray-400','text-red-400','text-orange-400','text-yellow-500','text-green-600'];for(let i=1;i<=4;i++)$('s'+i).className='h-1 flex-1 rounded-full transition-all '+(i<=st?c[st]:'bg-gray-200');$('strLbl').textContent=v?l[st]:'';$('strLbl').className='text-[10px] mt-1 '+(v?lc[st]:'text-gray-400');if(!v){showE('pwErr','Password is required.');setI(e);return false;}if(v.length<6){showE('pwErr','At least 6 characters.');setI(e);return false;}hideE('pwErr');setV(e);return true;}

    function vMatch(){const pw=$('password').value,cp=$('confirm-password'),v=cp.value;if(!v){hideE('matchErr');$('matchOk').classList.add('hidden');cp.classList.remove('border-red-400','border-green-400');cp.classList.add('border-gray-300');return false;}if(v!==pw){showE('matchErr',"Passwords don't match.");$('matchOk').classList.add('hidden');setI(cp);return false;}hideE('matchErr');$('matchOk').classList.remove('hidden');setV(cp);return true;}
    function vTerms(){if(!$('terms').checked){showE('termsErr','You must agree.');return false;}hideE('termsErr');return true;}

    function handleSignup(e){
      e.preventDefault();
      const ok=[vName(),vEmail(),vPhone(),vPw(),vMatch(),vTerms()].every(Boolean);
      if(!ok){$('signupForm').classList.add('shake');setTimeout(()=>$('signupForm').classList.remove('shake'),400);return;}
      $('submitBtn').disabled=true;$('submitBtn').classList.add('opacity-70');$('btnText').textContent='Creating Account...';$('btnSpin').classList.remove('hidden');
      
      localStorage.setItem("userRole", currentRole);

      setTimeout(()=>{
        $('submitBtn').disabled=false;$('submitBtn').classList.remove('opacity-70');$('btnText').textContent='Create Account';$('btnSpin').classList.add('hidden');
        const nm=$('fullname').value.trim().split(' ')[0];
        $('modalMsg').textContent=`Welcome ${nm}! Your ${currentRole} account has been successfully created.`;
        $('modal').classList.remove('hidden');

        setTimeout(() => { goToDashboard(); }, 1500);
      },1200);
    }

    function goToDashboard() {
      window.location.href = `auth.html?role=${currentRole}`;
    }
  </script>

</body>
</html>
