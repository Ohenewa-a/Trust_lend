<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TrustLend</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background: #f5f7fb; }
        .card:hover { transform: translateY(-5px); }
        @keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden relative">

        <div>
            <img src="/Trust_lend1/images/login(renter & owner).png"
                 class="w-full h-56 object-cover"
                 alt="Banner">
        </div>

        <div class="absolute top-8 left-8">
            <img src="/Trust_lend1/images/logo.png"
                 class="h-10"
                 alt="Logo">
        </div>

        <div class="py-10 px-8">

            <h1 class="text-4xl font-bold text-center text-[#0E2B63]">
                Welcome
                <span class="text-yellow-500">back!</span>
            </h1>

            <p class="text-center text-gray-500 mt-2">
                Choose your account type to continue
            </p>

            <div class="w-40 h-2 bg-[#0E2B63] rounded-full mx-auto mt-3"></div>

            <div class="grid md:grid-cols-2 gap-10 mt-16">

                <div class="text-center">

                    <img src="/Trust_lend1/images/sony-fx3.png"
                         class="h-32 mx-auto mb-5"
                         alt="Renter">

                    <div
                        onclick="loginRole('renter')"
                        tabindex="0"
                        role="button"
                        onkeydown="if(event.key==='Enter')loginRole('renter')"
                        id="renterCard"
                        class="card bg-yellow-400 rounded-xl p-6 shadow-lg cursor-pointer transition duration-300 focus:ring-4 focus:ring-yellow-200 outline-none">

                        <div class="flex justify-between items-center">

                            <div class="text-left">
                                <h2 class="text-3xl font-bold text-[#0E2B63]">I'm a</h2>
                                <h3 class="text-3xl font-bold text-[#0E2B63]">Renter</h3>
                                <p class="text-sm text-gray-700 mt-2">Rent equipment safely and conveniently.</p>
                            </div>

                            <div id="renterArrow" class="text-3xl text-[#0E2B63]">→</div>

                        </div>

                    </div>

                </div>

                <div class="text-center">

                    <img src="/Trust_lend1/images/excavator(2).png"
                         class="h-32 mx-auto mb-5"
                         alt="Owner">

                    <div
                        onclick="loginRole('owner')"
                        tabindex="0"
                        role="button"
                        onkeydown="if(event.key==='Enter')loginRole('owner')"
                        id="ownerCard"
                        class="card bg-yellow-400 rounded-xl p-6 shadow-lg cursor-pointer transition duration-300 focus:ring-4 focus:ring-yellow-200 outline-none">

                        <div class="flex justify-between items-center">

                            <div class="text-left">
                                <h2 class="text-3xl font-bold text-[#0E2B63]">I'm an</h2>
                                <h3 class="text-3xl font-bold text-[#0E2B63]">Owner</h3>
                                <p class="text-sm text-gray-700 mt-2">Manage your equipment and rentals.</p>
                            </div>

                            <div id="ownerArrow" class="text-3xl text-[#0E2B63]">→</div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="text-center mt-14">
                <p class="text-gray-500">
                    Don't have an account?
                    <a href="create-account.html" class="text-yellow-500 font-semibold hover:underline">Sign Up</a>
                </p>
            </div>

        </div>

    </div>

<script>
function loginRole(role) {
    localStorage.setItem("userRole", role);

    // Get the clicked card
    const card = document.getElementById(role + 'Card');
    const arrow = document.getElementById(role + 'Arrow');

    // Loading state
    card.style.pointerEvents = 'none';
    card.classList.add('opacity-80');
    arrow.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-2xl"></i>';

    // Brief delay for visual feedback then redirect
    setTimeout(() => {
        window.location.href = `auth.html?role=${role}`;
    }, 600);
}
</script>

</body>
</html>
